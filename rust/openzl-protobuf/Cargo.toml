[package]
name = "openzl-protobuf"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Rust bindings for OpenZL protobuf compression"
links = "openzl_protobuf_core_ffi"
build = "build.rs"

[features]
default = []
training = []

[dependencies]

[dev-dependencies]
prost = "0.14.3"

[build-dependencies]
cmake = "0.1.57"

[[test]]
name = "train_options"
path = "tests/train_options.rs"
required-features = ["training"]

[[test]]
name = "pareto_frontier"
path = "tests/pareto_frontier.rs"
required-features = ["training"]
